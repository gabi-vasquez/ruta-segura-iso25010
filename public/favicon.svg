<!-- Define un icono pequeño que combina ruta y verificación. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Usa el azul principal como fondo reconocible en una pestaña. -->
  <rect width="32" height="32" rx="16" fill="#10243e"/>
  <!-- Dibuja la confirmación de una ruta segura. -->
  <path d="M8 17l5 5 11-12" fill="none" stroke="#f5c451" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
